
<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drinkassistent 🍸</title>

<style>
* { box-sizing:border-box; }
html { scroll-behavior:auto; }

body {
  font-family:system-ui,sans-serif;
  background:#fafafa;
  color:#222;
  margin:0;
  padding:1rem;
  max-width:1000px;
  margin-inline:auto;
}

h1 { text-align:center; }
h2 { margin-top:1.6rem; }
button { font:inherit; cursor:pointer; }

details.section {
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:.9rem 1rem;
  margin:1rem 0;
}

details.section > summary {
  cursor:pointer;
  font-weight:700;
  font-size:1.1rem;
  list-style:none;
}

details.section > summary::-webkit-details-marker { display:none; }
details.section > summary::after {
  content:"＋";
  float:right;
  color:#777;
}
details.section[open] > summary::after { content:"−"; }

/* BARSKÅP */

#ingredients {
  display:grid;
  grid-template-columns:1fr;
  gap:.65rem;
  margin-top:1rem;
}

.category {
  border:1px solid #eee;
  border-radius:9px;
  padding:.65rem;
  min-width:0;
}

.category summary {
  cursor:pointer;
  font-weight:650;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.5rem;
  font-size:.95rem;
}

.category summary::-webkit-details-marker { display:none; }
.category summary::after {
  content:"＋";
  color:#777;
  flex-shrink:0;
}
.category[open] summary::after { content:"−"; }

.category label {
  display:block;
  cursor:pointer;
  margin:.55rem 0;
  padding:.1rem 0;
}

/* DRINKAR */

.drink {
  border:1px solid #ccc;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  background:#fff;
}

.possible {
  background:#e5f8e4;
  border-color:#9bd59a;
}

.almost {
  background:#fff8dc;
  border-color:#ead58b;
}

.details {
  margin-top:.6rem;
  font-size:.92rem;
  display:none;
}

.drink.open .details { display:block; }

.drink-header {
  display:flex;
  align-items:center;
  gap:.5rem;
}

.drink-header strong {
  cursor:pointer;
  flex:1;
}

.favorite-btn {
  border:0;
  background:none;
  font-size:25px;
  color:#aaa;
  padding:0 .25rem;
}

.favorite-btn.active { color:#e0a000; }

.action-btn {
  border:1px solid #c9c9c9;
  border-radius:9px;
  padding:.55rem .75rem;
  background:#fff;
}

.action-btn.selected {
  background:#e7f2ff;
  border-color:#3983d6;
}

.action-btn:disabled {
  background:#e9e9e9;
  color:#888;
  border-color:#ddd;
  cursor:default;
  opacity:1;
}

.mode-switch {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.5rem;
  margin:1rem 0;
}

.mode-switch button {
  padding:.8rem .5rem;
  border:1px solid #bbb;
  border-radius:12px;
  background:#fff;
  font-weight:650;
}

.mode-switch button.active {
  background:#173f67;
  color:#fff;
  border-color:#173f67;
}

#profiles {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.55rem;
  margin:.7rem 0 1rem;
}

.profile-btn {
  border:1px solid #d2d2d2;
  background:#fff;
  border-radius:12px;
  padding:.75rem .35rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.2rem;
  min-height:76px;
}

.profile-btn .emoji { font-size:1.5rem; }

.profile-btn.active {
  border:2px solid #26834a;
  background:#e7f6eb;
  padding:calc(.75rem - 1px) calc(.35rem - 1px);
}

#search {
  display:block;
  width:100%;
  padding:13px;
  margin:18px 0;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

#surprise {
  display:block;
  margin:1rem auto;
  padding:.75rem 1.5rem;
  font-size:1.05rem;
  border:0;
  border-radius:10px;
  background:#007bff;
  color:white;
}

.highlight {
  border:2px solid #ff9800;
  box-shadow:0 0 10px #ff9800;
}

.missing-ingredient {
  color:#d92525;
  font-weight:650;
}

.drink-actions {
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
  margin-top:.65rem;
}

/* INKÖPSLISTA */

.shopping-panel { margin-top:1rem; }

.shopping-row {
  display:flex;
  align-items:center;
  gap:.6rem;
  padding:.55rem 0;
  border-bottom:1px solid #eee;
}

.shopping-row input {
  width:19px;
  height:19px;
  flex-shrink:0;
}

.shopping-row .qty {
  color:#777;
  font-size:.8rem;
  margin-left:auto;
  text-align:right;
}

.shopping-row.done span {
  text-decoration:line-through;
  color:#999;
}

.shopping-row.done { opacity:.75; }

.shopping-heading {
  margin-top:1.2rem;
  margin-bottom:.3rem;
}

/* RECEPT I INKÖPSLISTAN */

.shopping-recipe {
  border:1px solid #e5e5e5;
  border-radius:9px;
  margin:.5rem 0;
  background:#fff;
}

.shopping-recipe summary {
  cursor:pointer;
  padding:.75rem;
  font-weight:650;
  list-style:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:.5rem;
}

.shopping-recipe summary::-webkit-details-marker { display:none; }
.shopping-recipe summary::after {
  content:"＋";
  color:#777;
  flex-shrink:0;
}
.shopping-recipe[open] summary::after { content:"−"; }

.shopping-recipe-content {
  padding:0 .8rem .7rem;
  font-size:.92rem;
}

.shopping-recipe-content ul { padding-left:1.3rem; }
.shopping-recipe-content li { margin:.3rem 0; }
.shopping-recipe-content p { margin-bottom:.3rem; }

.muted {
  color:#666;
  font-size:.9rem;
}

.support {
  display:block;
  text-align:center;
  margin:35px auto 15px;
  padding:12px;
  background:#eee;
  color:#333;
  border-radius:10px;
  text-decoration:none;
  max-width:300px;
}

@media(max-width:600px) {
  body { padding:.8rem; }
  .category { padding:.6rem; }
  .shopping-row .qty { max-width:42%; }
}
</style>
</head>

/* GEMENSAMMA HJÄLPFUNKTIONER */

function selectedIngredients(){
  return Array.from(
    document.querySelectorAll("#ingredients input:checked")
  ).map(cb=>cb.value);
}

function saveIngredients(){
  savedIngredients=selectedIngredients();
  localStorage.setItem("drinkIngredients",JSON.stringify(savedIngredients));
}

function saveFavorites(){
  localStorage.setItem("drinkFavorites",JSON.stringify(favorites));
}

function saveShopping(){
  localStorage.setItem("drinkShoppingDrinks",JSON.stringify(shoppingDrinks));
  localStorage.setItem("drinkPurchasedShopping",JSON.stringify(purchasedShopping));
  localStorage.setItem("drinkAutoAddedShopping",JSON.stringify(autoAddedShopping));
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function restoreFocusAndScroll(scrollY,selector){
  requestAnimationFrame(()=>{
    if(selector){
      const target=document.querySelector(selector);
      if(target){
        target.focus({preventScroll:true});
      }
    }

    window.scrollTo(0,scrollY);
  });
}

/* BARSKÅP */

Object.entries(categories).forEach(([cat,items])=>{
  const category=document.createElement("details");
  category.className="category";
  category.open=false;

  const heading=document.createElement("summary");
  heading.textContent=cat;
  category.appendChild(heading);

  items.forEach(item=>{
    const label=document.createElement("label");
    const cb=document.createElement("input");

    cb.type="checkbox";
    cb.value=item;
    cb.checked=savedIngredients.includes(item);

    cb.addEventListener("change",()=>{
      const scrollY=window.scrollY;
      saveIngredients();
      updateResults();
      restoreFocusAndScroll(scrollY,null);
    });

    label.append(cb,document.createTextNode(" "+item));
    category.appendChild(label);
  });

  ingredientsDiv.appendChild(category);
});

    updateResults();
    restoreFocusAndScroll(scrollY,null);
  });

  profilesDiv.appendChild(btn);
});

/* BARSKÅP – HJÄLPFUNKTION */

function setBarIngredient(item,checked){
  const checkbox=Array.from(
    document.querySelectorAll("#ingredients input")
  ).find(cb=>cb.value===item);

  if(checkbox){
    checkbox.checked=checked;
  }

  saveIngredients();
}

/* FAVORITER */

function renderFavorites(){
  favoritesDiv.innerHTML="";

  const selected=selectedIngredients();

  const favs=drinks
    .filter(d=>favorites.includes(d.name))
    .sort((a,b)=>
      (drinkOrderIndex.get(a.name)??999)-
      (drinkOrderIndex.get(b.name)??999)
    );

  document.querySelector("#favoritesSection summary").textContent=
    `⭐ Mina favoriter (${favs.length})`;

  if(!favs.length){
    favoritesDiv.innerHTML=`
      <p class="muted">
        Du har inga favoriter ännu.
        Tryck på ☆ vid en drink för att spara den.
      </p>
    `;
  }else{
    favs.forEach(d=>
      favoritesDiv.appendChild(createDrinkCard(d,selected,"favorite"))
    );
  }
}

function toggleFavorite(drinkName){
  const scrollY=window.scrollY;

  const anchor=Array.from(resultsDiv.querySelectorAll(".drink"))
    .find(card=>card.dataset.drink===drinkName)
    ||resultsDiv.querySelector(".drink")
    ||document.getElementById("resultsHeading");

  const oldTop=anchor?.getBoundingClientRect().top ?? null;

  const isFavorite=favorites.includes(drinkName);

  favorites=isFavorite
    ?favorites.filter(n=>n!==drinkName)
    :[...favorites,drinkName];

  saveFavorites();
  renderFavorites();

  document.querySelectorAll(".favorite-btn").forEach(btn=>{
    const card=btn.closest(".drink");
    const name=card?.dataset.drink;
    if(!name)return;

    const active=favorites.includes(name);
    btn.classList.toggle("active",active);
    btn.textContent=active?"★":"☆";
    btn.title=active?"Ta bort favorit":"Spara favorit";
    btn.setAttribute("aria-label",btn.title);
  });

  requestAnimationFrame(()=>{
    if(anchor && oldTop!==null){
      const newTop=anchor.getBoundingClientRect().top;
      window.scrollBy(0,newTop-oldTop);
    }else{
      window.scrollTo(0,scrollY);
    }
  });
}

/* INKÖPSLISTA */

/*
  Bevara den synliga drinkens position när inköpslistan
  byggs om. Det motverkar hopp när panelens höjd ändras.
*/
function renderShoppingListPreservingPosition(){
  const active=document.activeElement;
  const card=active?.closest?.(".drink");
  const oldTop=card?.getBoundingClientRect().top ?? null;

  renderShoppingList();

  if(card && oldTop!==null){
    requestAnimationFrame(()=>{
      const newTop=card.getBoundingClientRect().top;
      window.scrollBy(0,newTop-oldTop);
    });
  }
}

function refreshShoppingButtons(){
  const selected=selectedIngredients();

  document.querySelectorAll("[data-shopping-button]").forEach(btn=>{
    const name=btn.dataset.shoppingButton;
    const drink=drinks.find(d=>d.name===name);
    if(!drink)return;

    const inShopping=shoppingDrinks.includes(name);
    const hasEverything=drink.recipe.every(([item])=>
      selected.includes(item)
    );

    btn.classList.toggle("selected",inShopping);
    btn.disabled=hasEverything&&!inShopping;

    btn.textContent=inShopping
      ?"✓ Tillagd i inköpslistan"
      :(hasEverything?"✓ Har allt":"🛒 + Inköpslista");
  });
}

function addDrinkToShopping(name){
  if(!shoppingDrinks.includes(name)){
    shoppingDrinks.push(name);
  }

  saveShopping();
  renderShoppingListPreservingPosition();
  refreshShoppingButtons();
}

function removeDrinkFromShopping(name){
  shoppingDrinks=shoppingDrinks.filter(n=>n!==name);

  saveShopping();
  renderShoppingListPreservingPosition();
  refreshShoppingButtons();
}

function getShoppingItems(chosen){
  const needed=new Map();

  chosen.forEach(d=>{
    d.recipe.forEach(([item])=>{
      if(!needed.has(item)){
        needed.set(item,{optional:false,drinks:[]});
      }

      needed.get(item).drinks.push(d.name);
    });

    (garnishesByDrink[d.name]||[]).forEach(item=>{
      if(!needed.has(item)){
        needed.set(item,{optional:true,drinks:[]});
      }

      if(!needed.get(item).drinks.includes(d.name)){
        needed.get(item).drinks.push(d.name);
      }
    });
  });

  chosen.forEach(d=>{
    d.recipe.forEach(([item])=>{
      if(needed.has(item)){
        needed.get(item).optional=false;
      }
    });
  });

  return needed;
}

function renderShoppingList(){
  // Spara öppna recept innan panelen uppdateras.
  shoppingPanel.querySelectorAll(".shopping-recipe").forEach(el=>{
    if(el.open){
      openShoppingRecipes.add(el.dataset.drink);
    }else{
      openShoppingRecipes.delete(el.dataset.drink);
    }
  });

  // Spara fokus om användaren ändrar en inköpsruta.
  const active=document.activeElement;
  const activeItem=active?.dataset?.shopItem;
  const wasShoppingCheckbox=active?.matches?.("[data-shop-item]");
  const scrollY=window.scrollY;

  const selected=selectedIngredients();
  const chosen=drinks.filter(d=>shoppingDrinks.includes(d.name));
  const needed=getShoppingItems(chosen);

  const allItems=[...needed.keys()].sort((a,b)=>a.localeCompare(b,"sv"));

  const activeItems=allItems.filter(item=>
    !selected.includes(item)&&!purchasedShopping.includes(item)
  );

  const completedItems=allItems.filter(item=>
    purchasedShopping.includes(item)
  );

  if(chosen.length===0){
    shoppingPanel.innerHTML=`
      <p class="muted">
        Lägg till drinkar med knappen ”+ Inköpslista”
        så samlar vi ingredienserna här.
      </p>
    `;

    return;
  }

  const recipesHtml=chosen.map(d=>{
    const recipeItems=d.recipe.map(([item,amount])=>`
      <li>${esc(amount)} ${esc(item)}</li>
    `).join("");

    const garnishes=(garnishesByDrink[d.name]||[]).map(item=>`
      <li>${esc(item)} <small class="muted">(valfri garnering)</small></li>
    `).join("");

    return `
      <details class="shopping-recipe"
        data-drink="${esc(d.name)}"
        ${openShoppingRecipes.has(d.name)?"open":""}>
        <summary>${esc(d.name)}</summary>
        <div class="shopping-recipe-content">
          <strong>Ingredienser</strong>
          <ul>${recipeItems}${garnishes}</ul>
          <strong>Gör så här</strong>
          <p><em>${esc(d.steps)}</em></p>
        </div>
      </details>
    `;
  }).join("");

  shoppingPanel.innerHTML=`
    <p class="muted">
      Inköpslista för ${chosen.length} valda drinkar.
      Ingredienser du redan har hemma är borttagna.
    </p>

    <h3 class="shopping-heading">🛒 Att handla (${activeItems.length})</h3>

    ${activeItems.length?activeItems.map(item=>{
      const info=needed.get(item);

      return `
        <label class="shopping-row">
          <input type="checkbox" data-shop-item="${esc(item)}">
          <span>
            ${esc(item)}
            ${info.optional?'<small class="muted">(valfritt)</small>':""}
          </span>
          <span class="qty">${info.drinks.map(esc).join(", ")}</span>
        </label>
      `;
    }).join(""):`
      <p class="muted">Inget kvar att handla just nu. 🎉</p>
    `}

    <h3 class="shopping-heading">✅ Klart handlat (${completedItems.length})</h3>

    ${completedItems.length?completedItems.map(item=>{
      const info=needed.get(item);

      return `
        <label class="shopping-row done">
          <input type="checkbox"
            data-shop-item="${esc(item)}" checked>
          <span>
            ${esc(item)}
            ${info.optional?'<small class="muted">(valfritt)</small>':""}
          </span>
          <span class="qty">${info.drinks.map(esc).join(", ")}</span>
        </label>
      `;
    }).join(""):`
      <p class="muted">Inga inköpta ingredienser ännu.</p>
    `}

    <div class="drink-actions">
      <button class="action-btn" id="copyShopping">
        📋 Kopiera lista
      </button>
      <button class="action-btn" id="clearShopping">
        Töm inköpslistan
      </button>
    </div>

    <p class="muted">
      Valfria garneringar ingår också. Receptmängderna är inte
      rekommenderade flaskstorlekar.
    </p>

    <h4>🍹 Recept för dina valda drinkar</h4>
    ${recipesHtml}
  `;

  // Receptens öppna/stängda läge hanteras separat.
  shoppingPanel.querySelectorAll(".shopping-recipe")
    .forEach(el=>{
      el.addEventListener("toggle",()=>{
        if(el.open){
          openShoppingRecipes.add(el.dataset.drink);
        }else{
          openShoppingRecipes.delete(el.dataset.drink);
        }
      });
    });

  // Hantera inköpsrutorna.
  shoppingPanel.querySelectorAll("[data-shop-item]")
    .forEach(cb=>{
      cb.addEventListener("change",()=>{
        const item=cb.dataset.shopItem;

        if(cb.checked){
          if(!purchasedShopping.includes(item)){
            purchasedShopping.push(item);
          }

          if(!selectedIngredients().includes(item)){
            if(!autoAddedShopping.includes(item)){
              autoAddedShopping.push(item);
            }
            setBarIngredient(item,true);
          }
        }else{
          purchasedShopping=purchasedShopping.filter(x=>x!==item);

          if(autoAddedShopping.includes(item)){
            autoAddedShopping=autoAddedShopping.filter(x=>x!==item);
            setBarIngredient(item,false);
          }
        }

        saveShopping();
        updateResults();
      });
    });

  document.getElementById("copyShopping")
    .addEventListener("click",()=>{
      const text=[
        "Inköpslista",
        ...activeItems.map(x=>"- "+x)
      ].join("\n");

      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text)
          .then(()=>alert("Inköpslistan kopierades."))
          .catch(()=>alert(text));
      }else{
        alert(text);
      }
    });

  document.getElementById("clearShopping")
    .addEventListener("click",()=>{
      shoppingDrinks=[];
      purchasedShopping=[];
      autoAddedShopping=[];
      openShoppingRecipes.clear();
      saveShopping();
      updateResults();
    });

  // Återskapa fokus och scroll endast vid ändring av inköpsruta.
  if(wasShoppingCheckbox && activeItem){
    restoreFocusAndScroll(
      scrollY,
      `[data-shop-item="${CSS.escape(activeItem)}"]`
    );
  }
}

/* DRINKKORT */

function createDrinkCard(drink,selected,context="results"){
  const base=drink.recipe.map(r=>r[0]);
  const missing=base.filter(x=>!selected.includes(x));

  const status=missing.length===0
    ?"possible"
    :(base.some(x=>selected.includes(x))?"almost":"missing");

  const isFavorite=favorites.includes(drink.name);
  const inShopping=shoppingDrinks.includes(drink.name);
  const hasEverything=missing.length===0;

  const card=document.createElement("div");
  card.className="drink "+status;
  card.dataset.drink=drink.name;

  const isOpen=context==="favorite"
    ?openFavoriteDrinkNames.has(drink.name)
    :openDrinkNames.has(drink.name);

  if(isOpen){
    card.classList.add("open");
  }

  const header=document.createElement("div");
  header.className="drink-header";

  const title=document.createElement("strong");
  title.textContent=drink.name;

  const fav=document.createElement("button");
  fav.type="button";
  fav.className="favorite-btn"+(isFavorite?" active":"");
  fav.textContent=isFavorite?"★":"☆";
  fav.title=isFavorite?"Ta bort favorit":"Spara favorit";
  fav.setAttribute("aria-label",fav.title);

  fav.addEventListener("click",()=>{
    toggleFavorite(drink.name);
  });

  header.append(title,fav);
  card.appendChild(header);

  const details=document.createElement("div");
  details.className="details";

  const recipeItems=drink.recipe.map(([item,amount])=>`
    <li class="${selected.includes(item)?"":"missing-ingredient"}">
      ${esc(amount)} ${esc(item)}
    </li>
  `).join("");

  const garnishes=(garnishesByDrink[drink.name]||[])
    .map(g=>`
      <li style="color:#888">
        Garnering: ${esc(g)} (valfritt)
      </li>
    `).join("");

  const profile=(drinkProfiles[drink.name]||[]).join(" · ");

  details.innerHTML=`
    <p><small>Smakprofil: ${esc(profile||"Ej angiven")}</small></p>
    <h4>Recept</h4>

    ${missing.length
      ?`<p class="missing-ingredient">
          Saknas hemma: ${missing.map(esc).join(", ")}
        </p>`
      :`<p style="color:green;font-weight:bold">
          Du har allt som behövs! 🎉
        </p>`
    }

    <ul>${recipeItems}${garnishes}</ul>
    <p><em>${esc(drink.steps)}</em></p>

    <div class="drink-actions">
      <button
        class="action-btn ${inShopping?"selected":""}"
        data-shopping-button="${esc(drink.name)}"
        ${hasEverything&&!inShopping?"disabled":""}>
        ${inShopping
          ?"✓ Tillagd i inköpslistan"
          :(hasEverything
            ?"✓ Har allt"
            :"🛒 + Inköpslista")}
      </button>
    </div>
  `;

  const shoppingButton=details.querySelector("[data-shopping-button]");

  shoppingButton.addEventListener("click",()=>{
    if(inShopping){
      removeDrinkFromShopping(drink.name);
    }else if(!hasEverything){
      addDrinkToShopping(drink.name);
    }
  });

  // Öppna bara det kort som klickas.
  // Favoriter och resultat har separata öppningslägen.
  title.addEventListener("click",()=>{
    const openSet=context==="favorite"
      ?openFavoriteDrinkNames
      :openDrinkNames;

    if(openSet.has(drink.name)){
      openSet.delete(drink.name);
      card.classList.remove("open");
    }else{
      openSet.add(drink.name);
      card.classList.add("open");
    }
  });

  card.appendChild(details);
  return card;
}

/* UPPDATERA RESULTAT */

function updateResults(){
  const scrollY=window.scrollY;

  const active=document.activeElement;
  const activeShoppingDrink=active?.dataset?.shoppingButton;
  const restoreShoppingButton=active?.matches?.("[data-shopping-button]");

  const selected=selectedIngredients();
  const term=searchInput.value.toLowerCase().trim();

  saveIngredients();
  renderFavorites();

  const filtered=drinks.filter(d=>{
    const matchesSearch=
      !term||
      d.name.toLowerCase().includes(term)||
      d.recipe.some(r=>r[0].toLowerCase().includes(term))||
      (garnishesByDrink[d.name]||[]).some(g=>g.toLowerCase().includes(term));

    const p=drinkProfiles[d.name]||[];

    const matchesProfile=
      !selectedProfiles.length||
      selectedProfiles.some(x=>p.includes(x));

    return matchesSearch&&matchesProfile;
  });

  const ranked=filtered.map(drink=>{
    const count=drink.recipe.filter(r=>
      selected.includes(r[0])
    ).length;

    return {
      drink,
      count,
      possible:count===drink.recipe.length
    };
  }).filter(x=>{
    if(term)return true;
    if(mode==="shop")return true;

    return selected.length===0||x.count>0;
  });

  ranked.sort((a,b)=>
    Number(b.possible)-Number(a.possible)||
    b.count-a.count||
    (drinkOrderIndex.get(a.drink.name)??999)-
    (drinkOrderIndex.get(b.drink.name)??999)
  );

  resultsDiv.innerHTML="";

  if(!ranked.length){
    resultsDiv.innerHTML=`
      <p>Inga drinkar matchar dina val. Testa en annan smakprofil eller sökning.</p>
    `;
  }else{
    ranked.forEach(x=>
      resultsDiv.appendChild(createDrinkCard(x.drink,selected,"results"))
    );
  }

  document.getElementById("resultsHeading").textContent=
    mode==="shop"
      ?"🛒 Drinkar att handla till"
      :"🍹 Drinkförslag";

  renderShoppingList();

  requestAnimationFrame(()=>{
    if(restoreShoppingButton && activeShoppingDrink){
      const selector=
        `[data-shopping-button="${CSS.escape(activeShoppingDrink)}"]`;
      const target=document.querySelector(selector);

      if(target){
        target.focus({preventScroll:true});
      }
    }

    window.scrollTo(0,scrollY);
  });
}

/* LÄGESVÄLJARE */

function setMode(next){
  const scrollY=window.scrollY;
  mode=next;

  makeModeBtn.classList.toggle("active",mode==="make");
  shopModeBtn.classList.toggle("active",mode==="shop");

  updateResults();
  restoreFocusAndScroll(scrollY,null);
}

makeModeBtn.addEventListener("click",()=>setMode("make"));
shopModeBtn.addEventListener("click",()=>setMode("shop"));

/* SÖKNING */

searchInput.addEventListener("input",updateResults);

/* ÅTERSTÄLL BARSKÅP */

document.getElementById("resetIngredients")
  .addEventListener("click",()=>{
    const scrollY=window.scrollY;

    document.querySelectorAll("#ingredients input")
      .forEach(cb=>cb.checked=false);

    savedIngredients=[];
    localStorage.removeItem("drinkIngredients");

    updateResults();
    restoreFocusAndScroll(scrollY,null);
});

/* SURPRISE ME */

document.getElementById("surprise")
  .addEventListener("click",()=>{
    document.querySelectorAll(".drink.highlight")
      .forEach(d=>d.classList.remove("highlight"));

    const cards=Array.from(resultsDiv.children)
      .filter(d=>d.classList.contains("drink"));

    if(!cards.length)return;

    const pick=cards[Math.floor(Math.random()*cards.length)];

    openDrinkNames.add(pick.dataset.drink);
    updateResults();

    const opened=Array.from(resultsDiv.children)
      .find(d=>d.classList.contains("drink")&&
        d.dataset.drink===pick.dataset.drink);

    if(opened){
      opened.classList.add("highlight","open");
      opened.scrollIntoView({behavior:"smooth",block:"center"});
    }
});

/* STARTA APPEN */

updateResults();

</script>
