<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drinkassistent 🍸</title>

<style>
* { box-sizing:border-box; }

body {
  font-family:system-ui,sans-serif;
  background:#fafafa;
  color:#222;
  margin:0;
  padding:1rem;
  max-width:1000px;
  margin-inline:auto;
}

h1 { text-align:center; }
h2 { margin-top:1.6rem; }

button { font:inherit; cursor:pointer; }

details.section {
  background:#fff;
  border:1px solid #ddd;
  border-radius:12px;
  padding:.9rem 1rem;
  margin:1rem 0;
}

details.section > summary {
  cursor:pointer;
  font-weight:700;
  font-size:1.1rem;
  list-style:none;
}

details.section > summary::-webkit-details-marker {
  display:none;
}

details.section > summary::after {
  content:"＋";
  float:right;
  color:#777;
}

details.section[open] > summary::after {
  content:"−";
}

#ingredients {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1rem;
  margin-top:1rem;
}

.left-column,.right-column {
  display:grid;
  align-content:start;
  gap:.8rem;
}

.category {
  border:1px solid #eee;
  border-radius:9px;
  padding:.6rem;
}

.category summary {
  cursor:pointer;
  font-weight:650;
}

.category label {
  display:block;
  cursor:pointer;
  margin:.4rem 0;
}

.drink {
  border:1px solid #ccc;
  border-radius:12px;
  padding:12px;
  margin:10px 0;
  background:#fff;
}

.possible {
  background:#e5f8e4;
  border-color:#9bd59a;
}

.almost {
  background:#fff8dc;
  border-color:#ead58b;
}

.details {
  margin-top:.6rem;
  font-size:.92rem;
  display:none;
}

.drink.open .details {
  display:block;
}

.drink-header {
  display:flex;
  align-items:center;
  gap:.5rem;
}

.drink-header strong {
  cursor:pointer;
  flex:1;
}

.favorite-btn {
  border:0;
  background:none;
  font-size:25px;
  color:#aaa;
  padding:0 .25rem;
}

.favorite-btn.active {
  color:#e0a000;
}

.action-btn {
  border:1px solid #c9c9c9;
  border-radius:9px;
  padding:.55rem .75rem;
  background:#fff;
}

.action-btn.selected {
  background:#e7f2ff;
  border-color:#3983d6;
}

.mode-switch {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:.5rem;
  margin:1rem 0;
}

.mode-switch button {
  padding:.8rem .5rem;
  border:1px solid #bbb;
  border-radius:12px;
  background:#fff;
  font-weight:650;
}

.mode-switch button.active {
  background:#173f67;
  color:#fff;
  border-color:#173f67;
}

#profiles {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:.55rem;
  margin:.7rem 0 1rem;
}

.profile-btn {
  border:1px solid #d2d2d2;
  background:#fff;
  border-radius:12px;
  padding:.75rem .35rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.2rem;
  min-height:76px;
}

.profile-btn .emoji { font-size:1.5rem; }

.profile-btn.active {
  border:2px solid #26834a;
  background:#e7f6eb;
  padding:calc(.75rem - 1px) calc(.35rem - 1px);
}

#search {
  display:block;
  width:100%;
  padding:13px;
  margin:18px 0;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

#surprise {
  display:block;
  margin:1rem auto;
  padding:.75rem 1.5rem;
  font-size:1.05rem;
  border:0;
  border-radius:10px;
  background:#007bff;
  color:white;
}

.highlight {
  border:2px solid #ff9800;
  box-shadow:0 0 10px #ff9800;
}

.missing-ingredient {
  color:#d92525;
  font-weight:650;
}

.drink-actions {
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
  margin-top:.65rem;
}

.shopping-panel {
  margin-top:1rem;
}

.shopping-row {
  display:flex;
  align-items:center;
  gap:.6rem;
  padding:.55rem 0;
  border-bottom:1px solid #eee;
}

.shopping-row input {
  width:19px;
  height:19px;
  flex-shrink:0;
}

.shopping-row .qty {
  color:#777;
  font-size:.8rem;
  margin-left:auto;
  text-align:right;
}

.shopping-row.done span {
  text-decoration:line-through;
  color:#999;
}

.shopping-row.done {
  opacity:.75;
}

.shopping-heading {
  margin-top:1.2rem;
  margin-bottom:.3rem;
}

.muted {
  color:#666;
  font-size:.9rem;
}

.support {
  display:block;
  text-align:center;
  margin:35px auto 15px;
  padding:12px;
  background:#eee;
  color:#333;
  border-radius:10px;
  text-decoration:none;
  max-width:300px;
}

@media(max-width:600px) {
  body { padding:.8rem; }
  #ingredients { gap:.7rem; }
  .shopping-row .qty { max-width:42%; }
}
</style>
</head>

<details class="section" id="shoppingSection" open>

</p>

<div id="profiles"></div>

<input type="search" id="search"

<button id="surprise">🎲 Överraska mig!</button>

<div id="results"></div>

<a class="support"
href="mailto:drinkar.cocktails@gmail.com?subject=Support">

let openDrinkName=null;

function selectedIngredients(){
  return Array.from(
    document.querySelectorAll("#ingredients input:checked")
  ).map(cb=>cb.value);
}

function saveIngredients(){
  savedIngredients=selectedIngredients();
  localStorage.setItem("drinkIngredients",JSON.stringify(savedIngredients));
}

function saveFavorites(){
  localStorage.setItem("drinkFavorites",JSON.stringify(favorites));
}

function saveShopping(){
  localStorage.setItem("drinkShoppingDrinks",JSON.stringify(shoppingDrinks));
  localStorage.setItem("drinkPurchasedShopping",JSON.stringify(purchasedShopping));
  localStorage.setItem("drinkAutoAddedShopping",JSON.stringify(autoAddedShopping));
}

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

// BARSKÅP

const leftColumn=document.createElement("div");
leftColumn.className="left-column";

const rightColumn=document.createElement("div");
rightColumn.className="right-column";

ingredientsDiv.append(leftColumn,rightColumn);

Object.entries(categories).forEach(([cat,items])=>{
  const category=document.createElement("details");
  category.className="category";
  category.open=false;

  const heading=document.createElement("summary");
  heading.textContent=cat;
  category.appendChild(heading);

  items.forEach(item=>{
    const label=document.createElement("label");
    const cb=document.createElement("input");

    cb.type="checkbox";
    cb.value=item;
    cb.checked=savedIngredients.includes(item);

    cb.addEventListener("change",()=>{
      saveIngredients();
      updateResults();
    });

    label.append(cb,document.createTextNode(" "+item));
    category.appendChild(label);
  });

  (cat==="Alkohol"||cat==="Frukt / Garnering"
    ?leftColumn:rightColumn).appendChild(category);
});

// SMAKPROFILER

profileOptions.forEach(p=>{
  const btn=document.createElement("button");
  btn.type="button";
  btn.className="profile-btn";

  btn.innerHTML=`
    <span class="emoji">${p.emoji}</span>
    <span>${p.name}</span>
  `;

  btn.addEventListener("click",()=>{
    selectedProfiles=selectedProfiles.includes(p.name)
      ?selectedProfiles.filter(x=>x!==p.name)
      :[...selectedProfiles,p.name];

    btn.classList.toggle("active",selectedProfiles.includes(p.name));
    updateResults();
  });

  profilesDiv.appendChild(btn);
});

// HJÄLPFUNKTIONER FÖR BARSKÅPET

function setBarIngredient(item,checked){
  const checkbox=Array.from(
    document.querySelectorAll("#ingredients input")
  ).find(cb=>cb.value===item);

  if(checkbox){
    checkbox.checked=checked;
  }

  saveIngredients();
}

// INKÖPSLISTA

function addDrinkToShopping(name){
  if(!shoppingDrinks.includes(name)){
    shoppingDrinks.push(name);
  }

  saveShopping();
  updateResults();
}

function removeDrinkFromShopping(name){
  shoppingDrinks=shoppingDrinks.filter(n=>n!==name);
  saveShopping();
  updateResults();
}

function getShoppingItems(chosen){
  const needed=new Map();

  chosen.forEach(d=>{
    d.recipe.forEach(([item])=>{
      if(!needed.has(item)){
        needed.set(item,{optional:false,drinks:[]});
      }

      needed.get(item).drinks.push(d.name);
    });

    // Garneringar läggs också till, men markeras som valfria.
    (garnishesByDrink[d.name]||[]).forEach(item=>{
      if(!needed.has(item)){
        needed.set(item,{optional:true,drinks:[]});
      }

      needed.get(item).optional=true;

      if(!needed.get(item).drinks.includes(d.name)){
        needed.get(item).drinks.push(d.name);
      }
    });
  });

  return needed;
}

function renderShoppingList(){
  const selected=selectedIngredients();

  const chosen=drinks.filter(d=>shoppingDrinks.includes(d.name));
  const needed=getShoppingItems(chosen);

  const allItems=[...needed.keys()].sort((a,b)=>a.localeCompare(b,"sv"));

  // Varor som redan finns i barskåpet visas inte bland det som ska handlas.
  // Men inköpta varor visas alltid i den färdiga delen.
  const activeItems=allItems.filter(item=>
    !selected.includes(item)&&!purchasedShopping.includes(item)
  );

  const completedItems=allItems.filter(item=>
    purchasedShopping.includes(item)
  );

  if(chosen.length===0){
    shoppingPanel.innerHTML=`
      <p class="muted">
        Lägg till drinkar med knappen ”+ Inköpslista”
        så samlar vi ingredienserna här.
      </p>
    `;
    return;
  }

  shoppingPanel.innerHTML=`
    <p class="muted">
      Inköpslista för ${chosen.length} valda drinkar.
      Ingredienser du redan har hemma är borttagna.
    </p>

    <h3 class="shopping-heading">🛒 Att handla (${activeItems.length})</h3>

    ${activeItems.length?activeItems.map(item=>{
      const info=needed.get(item);

      return `
        <label class="shopping-row">
          <input type="checkbox" data-shop-item="${esc(item)}">
          <span>
            ${esc(item)}
            ${info.optional?'<small class="muted">(valfritt)</small>':""}
          </span>
          <span class="qty">${info.drinks.map(esc).join(", ")}</span>
        </label>
      `;
    }).join(""):`
      <p class="muted">Inget kvar att handla just nu. 🎉</p>
    `}

    <h3 class="shopping-heading">✅ Klart handlat (${completedItems.length})</h3>

    ${completedItems.length?completedItems.map(item=>{
      const info=needed.get(item);

      return `
        <label class="shopping-row done">
          <input type="checkbox"
            data-shop-item="${esc(item)}" checked>
          <span>
            ${esc(item)}
            ${info.optional?'<small class="muted">(valfritt)</small>':""}
          </span>
          <span class="qty">${info.drinks.map(esc).join(", ")}</span>
        </label>
      `;
    }).join(""):`
      <p class="muted">Inga inköpta ingredienser ännu.</p>
    `}

    <div class="drink-actions">
      <button class="action-btn" id="copyShopping">
        📋 Kopiera lista
      </button>
      <button class="action-btn" id="clearShopping">
        Töm inköpslistan
      </button>
    </div>

    <p class="muted">
      Valfria garneringar ingår också. Receptmängderna är inte
      rekommenderade flaskstorlekar.
    </p>

    <h4>Valda drinkar</h4>
    <p>${chosen.map(d=>esc(d.name)).join(" · ")}</p>
  `;

  shoppingPanel.querySelectorAll("[data-shop-item]")
    .forEach(cb=>{
      cb.addEventListener("change",()=>{
        const item=cb.dataset.shopItem;

        if(cb.checked){
          if(!purchasedShopping.includes(item)){
            purchasedShopping.push(item);
          }

          // Lägg till i barskåpet om den inte redan finns där.
          if(!selectedIngredients().includes(item)){
            autoAddedShopping.push(item);
            setBarIngredient(item,true);
          }
        }else{
          purchasedShopping=purchasedShopping.filter(x=>x!==item);

          // Ta bara bort från barskåpet om inköpslistan lade till den.
          if(autoAddedShopping.includes(item)){
            autoAddedShopping=autoAddedShopping.filter(x=>x!==item);
            setBarIngredient(item,false);
          }
        }

        saveShopping();
        updateResults();
      });
    });

  document.getElementById("copyShopping")
    .addEventListener("click",()=>{
      const text=[
        "Inköpslista",
        ...activeItems.map(x=>"- "+x)
      ].join("\n");

      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text)
          .then(()=>alert("Inköpslistan kopierades."))
          .catch(()=>alert(text));
      }else{
        alert(text);
      }
    });

  document.getElementById("clearShopping")
    .addEventListener("click",()=>{
      shoppingDrinks=[];
      purchasedShopping=[];
      autoAddedShopping=[];
      saveShopping();
      updateResults();
    });
}

// DRINKKORT

function createDrinkCard(drink,selected){
  const base=drink.recipe.map(r=>r[0]);
  const missing=base.filter(x=>!selected.includes(x));

  const status=missing.length===0
    ?"possible"
    :(base.some(x=>selected.includes(x))?"almost":"missing");

  const isFavorite=favorites.includes(drink.name);
  const inShopping=shoppingDrinks.includes(drink.name);

  const card=document.createElement("div");
  card.className="drink "+status;

  if(openDrinkName===drink.name){
    card.classList.add("open");
  }

  const header=document.createElement("div");
  header.className="drink-header";

  const title=document.createElement("strong");
  title.textContent=drink.name;

  const fav=document.createElement("button");
  fav.className="favorite-btn"+(isFavorite?" active":"");
  fav.textContent=isFavorite?"★":"☆";
  fav.title="Spara favorit";

  fav.addEventListener("click",()=>{
    favorites=isFavorite
      ?favorites.filter(n=>n!==drink.name)
      :[...favorites,drink.name];

    saveFavorites();
    updateResults();
  });

  header.append(title,fav);
  card.appendChild(header);

  const details=document.createElement("div");
  details.className="details";

  const recipeItems=drink.recipe.map(([item,amount])=>`
    <li class="${selected.includes(item)?"":"missing-ingredient"}">
      ${esc(amount)} ${esc(item)}
    </li>
  `).join("");

  const garnishes=(garnishesByDrink[drink.name]||[])
    .map(g=>`
      <li style="color:#888">
        Garnering: ${esc(g)} (valfritt)
      </li>
    `).join("");

  const profile=(drinkProfiles[drink.name]||[]).join(" · ");

  details.innerHTML=`
    <p><small>Smakprofil: ${esc(profile||"Ej angiven")}</small></p>
    <h4>Recept</h4>

    ${missing.length
      ?`<p class="missing-ingredient">
          Saknas hemma: ${missing.map(esc).join(", ")}
        </p>`
      :`<p style="color:green;font-weight:bold">
          Du har allt som behövs! 🎉
        </p>`
    }

    <ul>${recipeItems}${garnishes}</ul>
    <p><em>${esc(drink.steps)}</em></p>

    <div class="drink-actions">
      <button class="action-btn ${inShopping?"selected":""}"
        data-shopping>
        ${inShopping
          ?"✓ Tillagd i inköpslistan"
          :"🛒 + Inköpslista"}
      </button>
    </div>
  `;

  details.querySelector("[data-shopping]")
    .addEventListener("click",()=>{
      inShopping
        ?removeDrinkFromShopping(drink.name)
        :addDrinkToShopping(drink.name);
    });

  // Endast klick på drinknamnet öppnar eller stänger receptet.
  title.addEventListener("click",()=>{
    openDrinkName=openDrinkName===drink.name?null:drink.name;
    updateResults();
  });

  card.appendChild(details);
  return card;
}

// UPPDATERA RESULTAT

function updateResults(){
  const selected=selectedIngredients();
  const term=searchInput.value.toLowerCase().trim();

  saveIngredients();

  // FAVORITER

  favoritesDiv.innerHTML="";

  const favs=drinks.filter(d=>favorites.includes(d.name));

  document.querySelector("#favoritesSection summary").textContent=
    `⭐ Mina favoriter (${favs.length})`;

  if(!favs.length){
    favoritesDiv.innerHTML=`
      <p class="muted">
        Du har inga favoriter ännu.
        Tryck på ☆ vid en drink för att spara den.
      </p>
    `;
  }else{
    favs.forEach(d=>
      favoritesDiv.appendChild(createDrinkCard(d,selected))
    );
  }

  // DRINKFILTER

  const filtered=drinks.filter(d=>{
    const matchesSearch=
      !term||
      d.name.toLowerCase().includes(term)||
      d.recipe.some(r=>r[0].toLowerCase().includes(term))||
      (garnishesByDrink[d.name]||[]).some(g=>g.toLowerCase().includes(term));

    const p=drinkProfiles[d.name]||[];

    const matchesProfile=
      !selectedProfiles.length||
      selectedProfiles.some(x=>p.includes(x));

    return matchesSearch&&matchesProfile;
  });

  const ranked=filtered.map(drink=>{
    const count=drink.recipe.filter(r=>
      selected.includes(r[0])
    ).length;

    return {
      drink,
      count,
      possible:count===drink.recipe.length
    };
  }).filter(x=>{
    if(term)return true;
    if(mode==="shop")return true;

    return selected.length===0||x.count>0;
  });

  ranked.sort((a,b)=>
    Number(b.possible)-Number(a.possible)||
    b.count-a.count
  );

  resultsDiv.innerHTML="";

  if(!ranked.length){
    resultsDiv.innerHTML=`
      <p>Inga drinkar matchar dina val. Testa en annan smakprofil eller sökning.</p>
    `;
  }else{
    ranked.forEach(x=>
      resultsDiv.appendChild(createDrinkCard(x.drink,selected))
    );
  }

  document.getElementById("resultsHeading").textContent=
    mode==="shop"
      ?"🛒 Drinkar att handla till"
      :"🍹 Drinkförslag";

  renderShoppingList();
}

// LÄGESVÄLJARE

function setMode(next){
  mode=next;

  makeModeBtn.classList.toggle("active",mode==="make");
  shopModeBtn.classList.toggle("active",mode==="shop");

  updateResults();
}

makeModeBtn.addEventListener("click",()=>setMode("make"));
shopModeBtn.addEventListener("click",()=>setMode("shop"));

// SÖKNING

searchInput.addEventListener("input",updateResults);

// ÅTERSTÄLL BARSKÅP

document.getElementById("resetIngredients")
  .addEventListener("click",()=>{
    document.querySelectorAll("#ingredients input")
      .forEach(cb=>cb.checked=false);

    savedIngredients=[];
    localStorage.removeItem("drinkIngredients");

    // Inköpshistoriken behålls även om barskåpet återställs.
    updateResults();
  });

// SURPRISE ME

document.getElementById("surprise")
  .addEventListener("click",()=>{
    document.querySelectorAll(".drink.highlight")
      .forEach(d=>d.classList.remove("highlight"));

    const cards=Array.from(resultsDiv.children)
      .filter(d=>d.classList.contains("drink"));

    if(!cards.length)return;

    const pick=cards[Math.floor(Math.random()*cards.length)];

    openDrinkName=pick.querySelector("strong").textContent;
    updateResults();

    const opened=Array.from(resultsDiv.children)
      .find(d=>d.classList.contains("drink")&&
        d.querySelector("strong").textContent===openDrinkName);

    if(opened){
      opened.classList.add("highlight","open");
      opened.scrollIntoView({behavior:"smooth",block:"center"});
    }
  });

// STARTA APPEN

updateResults();

</script>
